name: daily-stock-scan

on:
  workflow_dispatch:        # 手动触发(用于首次验证)
  schedule:                 # 以下均为 UTC, 对应北京时间(+8):
    - cron: '45 0 * * 1-5'  # 08:45 盘前情绪报告
    - cron: '35 1 * * 1-5'  # 09:35 开盘扫描(可打板候选 + 全池数据)
    - cron: '32 3 * * 1-5'  # 11:32 午盘情绪报告(量能+晋级率+建议)
    - cron: '58 5 * * 1-5'  # 13:58 尾盘一夜持股(提前触发, 早盘模式)
    - cron: '30 6 * * 1-5'  # 14:30 收盘前情绪与操作建议
    - cron: '5 7 * * 1-5'   # 15:05 当日涨停池

env:
  TZ: Asia/Shanghai         # 让脚本内的时间窗口按北京时间判断

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          # Server酱 SENDKEY 通过仓库 Secret 注入, 请务必不要明文写进代码
          NOTIFY_SERVERCHAN_KEY: ${{ secrets.NOTIFY_SERVERCHAN_KEY }}
        run: python gh_pipeline.py
