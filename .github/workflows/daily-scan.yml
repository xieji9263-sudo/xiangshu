name: daily-stock-scan

on:
  workflow_dispatch:        # 手动触发(用于首次验证)
  schedule:                 # 以下均为 UTC, 对应北京时间(+8):
    - cron: '50 0 * * 1-5'  # 08:50 情绪报告
    - cron: '26 1 * * 1-5'  # 09:26 竞价扫描
    - cron: '40 6 * * 1-5'  # 14:40 尾盘一夜持股
    - cron: '5 7 * * 1-5'   # 15:05 当日涨停池

env:
  TZ: Asia/Shanghai         # 让脚本内的时间窗口按北京时间判断

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          # Server酱 SENDKEY 通过仓库 Secret 注入, 请务必不要明文写进代码
          NOTIFY_SERVERCHAN_KEY: ${{ secrets.NOTIFY_SERVERCHAN_KEY }}
        run: python gh_pipeline.py
